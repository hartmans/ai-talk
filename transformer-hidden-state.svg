<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Inside a decoder-only transformer</title><desc id="desc">Token embeddings flow through repeated transformer blocks and final normalization. The final hidden state is a contextual vector per token, passed to the LLM head to produce vocabulary logits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b7c5e6"/></marker></defs><rect width="1600" height="820" rx="24" fill="#0b1427"/>
<text x="800" y="68" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b7c5e6">DECODER-ONLY TRANSFORMER · LEFT TO RIGHT</text>
