<text x="800" y="440" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b7c5e6">Update the</text>
<text x="800" y="473" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#b7c5e6">model weights</text>
<text x="355" y="650" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#b7c5e6">Related concepts can be far apart</text>
<text x="1245" y="650" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#edf2ff">Similar concepts → nearby vectors</text>
<text x="800" y="727" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#edf2ff">Each point: the final-token hidden state for a prompt about that concept.</text>
<text x="800" y="771" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#b7c5e6">Schematic 2D view of a high-dimensional vector space.</text>
