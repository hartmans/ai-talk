<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Training shapes the space of final hidden states</title>
<desc id="desc">Before similarity training, related concepts are scattered. After training, dog and puppy, coffee and espresso, and source code and software form three separate groups. Each point represents the final-token hidden state for a prompt; this is a schematic two-dimensional view.</desc>
